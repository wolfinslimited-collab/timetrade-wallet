<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Lovable App</title>
    <meta name="description" content="Lovable Generated Project" />
    <meta name="author" content="Lovable" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Lovable App" />
    <meta property="og:description" content="Lovable Generated Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <style>
      #app-loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#0E1116;display:flex;align-items:center;justify-content:center;z-index:99999}
      #app-loading img{width:80px;height:80px;border-radius:16px}
    </style>
    <div id="app-loading"><img src="/app-logo.png" alt="" /></div>
    <script>
      (function(){var r=document.getElementById('root');var o=new MutationObserver(function(){if(r.children.length>0){var l=document.getElementById('app-loading');if(l)l.remove();o.disconnect()}});o.observe(r,{childList:true})})();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
