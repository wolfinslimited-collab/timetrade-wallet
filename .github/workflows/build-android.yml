name: Build Android (Capacitor)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build record ID from Build Center"
        required: true
        type: string
  repository_dispatch:
    types: [build_android]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare app icon source
        run: |
          mkdir -p assets
          if [ -f public/app-logo.png ]; then
            SOURCE_PATH="public/app-logo.png"
          elif [ -f public/app-logo.jpg ]; then
            SOURCE_PATH="public/app-logo.jpg"
          elif [ -f public/app-logo.jpeg ]; then
            SOURCE_PATH="public/app-logo.jpeg"
          else
            echo "Missing app logo: add public/app-logo.png or public/app-logo.jpg"
            exit 1
          fi

          if command -v magick &>/dev/null; then
            magick "$SOURCE_PATH" -resize 1024x1024! -alpha remove -alpha off PNG24:assets/icon.png
          elif command -v convert &>/dev/null; then
            convert "$SOURCE_PATH" -resize 1024x1024! -alpha remove -alpha off PNG24:assets/icon.png
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            convert "$SOURCE_PATH" -resize 1024x1024! -alpha remove -alpha off PNG24:assets/icon.png
          fi

          echo "Icon prepared from $SOURCE_PATH: $(file assets/icon.png)"

      - name: Generate Android app icons
        run: npx --yes @capacitor/assets generate --android

      - name: Setup signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            cat > android/key.properties << KEYEOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          KEYEOF
            GRADLE_FILE="android/app/build.gradle"
            if [ -f "$GRADLE_FILE" ] && ! grep -q "signingConfigs" "$GRADLE_FILE"; then
              sed -i '/android {/a\
          \n    signingConfigs {\n        release {\n            def keystorePropertiesFile = rootProject.file("key.properties")\n            def keystoreProperties = new Properties()\n            keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n            storeFile file(keystoreProperties["storeFile"])\n            storePassword keystoreProperties["storePassword"]\n            keyAlias keystoreProperties["keyAlias"]\n            keyPassword keystoreProperties["keyPassword"]\n        }\n    }' "$GRADLE_FILE"
              sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' "$GRADLE_FILE"
            fi
          else
            echo "No signing keystore provided, building debug APK"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if [ -f "key.properties" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Build AAB (for Play Store)
        run: |
          cd android
          if [ -f "key.properties" ]; then
            ./gradlew bundleRelease
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: android-aab-${{ github.run_id }}
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Notify build complete
        if: always()
        run: |
          BUILD_ID="${{ github.event.inputs.build_id || github.event.client_payload.build_id || 'n/a' }}"
          echo "Build ID $BUILD_ID finished with status ${{ job.status }}"
