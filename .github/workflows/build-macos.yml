name: Build macOS

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build record ID from Build Center"
        required: true
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      FLUTTER_VERSION: "3.24.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Build macOS app
        working-directory: flutter_app
        run: flutter build macos --release

      - name: Package app bundle
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            flutter_app/build/macos/Build/Products/Release/timetrade_wallet.app \
            artifacts/timetrade-wallet-macos-${{ github.run_id }}.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ github.run_id }}
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Notify build complete
        if: always()
        run: echo "Build ID: ${{ inputs.build_id }} finished with status ${{ job.status }}"
