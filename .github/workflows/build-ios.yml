name: Build iOS (Capacitor)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build record ID from Build Center"
        required: true
        type: string
  repository_dispatch:
    types: [build_ios]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios || true

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Set iOS build number
        run: |
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "=== Setting CFBundleVersion to $BUILD_NUMBER ==="

          cd ios/App

          # Method 1: agvtool - Xcode's own versioning tool
          xcrun agvtool new-version -all "$BUILD_NUMBER" 2>&1 || echo "agvtool failed, continuing with fallback methods"

          # Method 2: Direct Info.plist patch
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" App/Info.plist

          # Method 3: Force CURRENT_PROJECT_VERSION in pbxproj
          PBXPROJ="App.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBXPROJ"

          # Method 4: Also set MARKETING_VERSION to avoid confusion
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = 1.0;/g" "$PBXPROJ"

          # Debug: verify all changes took effect
          echo "--- Info.plist after patching ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" App/Info.plist
          echo "--- pbxproj CURRENT_PROJECT_VERSION ---"
          grep "CURRENT_PROJECT_VERSION" "$PBXPROJ"

      - name: Setup signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          PROFILE_PLIST=$RUNNER_TEMP/profile.plist

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST" | sed "s/^${TEAM_ID}\\.//" )

          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"

          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          security create-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$PBXPROJ"
            sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$PBXPROJ"
            sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" "$PBXPROJ"
            if ! grep -q "PROVISIONING_PROFILE_SPECIFIER" "$PBXPROJ"; then
              sed -i '' "s/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" "$PBXPROJ"
            fi
          fi

          cat > ios/App/ExportOptions.plist << EXPORTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EXPORTEOF

      - name: Build Xcode archive
        run: |
          cd ios/App
          BUILD_NUMBER="${BUILD_NUMBER:-$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT}"
          echo "Building with CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
          echo "Pre-build CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' App/Info.plist)"

          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            INFOPLIST_KEY_CFBundleVersion="$BUILD_NUMBER"

      - name: Verify and patch archive version
        run: |
          BUILD_NUMBER="${BUILD_NUMBER:-$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT}"
          ARCHIVE_PLIST="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Info.plist"
          ARCHIVE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVE_PLIST")
          echo "Archive CFBundleVersion: $ARCHIVE_VERSION"

          if [ "$ARCHIVE_VERSION" = "1" ] || [ "$ARCHIVE_VERSION" = "$(CURRENT_PROJECT_VERSION)" ] || [ -z "$ARCHIVE_VERSION" ]; then
            echo "::warning::Archive has incorrect CFBundleVersion=$ARCHIVE_VERSION, patching to $BUILD_NUMBER"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$ARCHIVE_PLIST"
            echo "Patched CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVE_PLIST")"

            # Find the signing identity hash from keychain
            SIGN_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/app-signing.keychain-db" | grep "Apple Distribution" | head -1 | awk -F'"' '{print $2}')
            echo "Re-signing with: $SIGN_IDENTITY"

            # Re-sign the patched app
            ENTITLEMENTS="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/archived-expanded-entitlements.xcent"
            if [ -f "$ENTITLEMENTS" ]; then
              codesign --force --sign "$SIGN_IDENTITY" --entitlements "$ENTITLEMENTS" "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
            else
              codesign --force --sign "$SIGN_IDENTITY" --preserve-metadata=entitlements "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
            fi
            echo "Re-sign completed"
          else
            echo "Archive version OK: $ARCHIVE_VERSION"
          fi

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa-output

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_id }}
          path: ${{ runner.temp }}/ipa-output/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          IPA_PATH=$(find $RUNNER_TEMP/ipa-output -name "*.ipa" | head -1)

          # Final IPA verification
          TMP_UNZIP_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$TMP_UNZIP_DIR"
          IPA_BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$TMP_UNZIP_DIR/Payload/App.app/Info.plist")
          echo "IPA CFBundleVersion: $IPA_BUNDLE_VERSION"

          if [ -z "$IPA_BUNDLE_VERSION" ] || [ "$IPA_BUNDLE_VERSION" = "1" ]; then
            echo "::error::IPA still has CFBundleVersion=$IPA_BUNDLE_VERSION - all version patching failed!"
            exit 1
          fi

          echo "Uploading IPA: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Notify build complete
        if: always()
        run: |
          BUILD_ID="${{ github.event.inputs.build_id || github.event.client_payload.build_id || 'n/a' }}"
          echo "Build ID $BUILD_ID finished with status ${{ job.status }}"
