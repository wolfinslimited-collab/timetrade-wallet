name: timetrade_wallet
description: NextGen AI Crypto Wallet - Native Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  local_auth: ^2.2.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  bip39: ^1.0.6
  web3dart: ^2.7.3
  solana: ^0.31.0+1
  supabase_flutter: ^2.5.8
  cached_network_image: ^3.3.1
  share_plus: ^9.0.0
  url_launcher: ^6.2.6
  haptic_feedback: ^0.5.1+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.otf
        - asset: assets/fonts/SFProDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/SFProDisplay-Bold.otf
          weight: 700
